name: Notify website of Locknight update

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notify-locknight-website
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request website sync
        env:
          WEBSITE_SYNC_TOKEN: ${{ secrets.WEBSITE_SYNC_TOKEN }}
        run: |
          if [ -z "$WEBSITE_SYNC_TOKEN" ]; then
            echo "::notice::WEBSITE_SYNC_TOKEN is not configured. The website's scheduled sync will pick up this update."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $WEBSITE_SYNC_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/repos/Baegll/Baegll.github.io/actions/workflows/sync-locknight.yml/dispatches \
            -d '{"ref":"main"}'
